version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: amgr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amgr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amgr_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-amgr}
    
    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amgr} -d ${POSTGRES_DB:-amgr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: amgr-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://amgr:amgr_dev_only@db:5432/amgr}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: amgr-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
